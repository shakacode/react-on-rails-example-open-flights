---
kind: identity
name: "{{APP_NAME}}-pg-identity"
description: "{{APP_NAME}}-pg-identity"

---
kind: policy
name: "{{APP_NAME}}-pg-access"
description: "{{APP_NAME}}-pg-access"
bindings:
  - permissions:
      - reveal
# Uncomment these two
#      - use
#      - view
    principalLinks:
      - "//gvc/{{APP_NAME}}/identity/{{APP_NAME}}-pg-identity"
      # cpflow apply-template replaces {{APP_IDENTITY_LINK}} with the full app workload identity link.
      # Example: //gvc/{{APP_NAME}}/identity/{{APP_NAME}}-identity.
      - "{{APP_IDENTITY_LINK}}"
targetKind: secret
targetLinks:
  - "//secret/{{APP_NAME}}-pg"
  - "//secret/{{APP_NAME}}-pg-script"

---
kind: workload
name: postgres
description: postgres
spec:
  type: stateful
  containers:
    - cpu: 1000m
      memory: 512Mi
      env:
        # Uncomment next two envs will cause the db to be restored from the archive uri
        #        - name: POSTGRES_ARCHIVE_URI  #Use this var to control the automatic restore behavior. If you leave it out, the db will start empty.
        #          value: s3://YOUR_BUCKET/PATH_TO_ARCHIVE_FILE
        # - name: POSTGRES_DB #The name of the initial db in case of doing a restore
        #  value: test
        - name: PGDATA #The location postgres stores the db. This can be anything other than /var/lib/postgresql/data, but it must be inside the mount point for the volume set
          value: "/var/lib/postgresql/data/pg_data"
        - name: POSTGRES_PASSWORD #The password for the default user
          value: "cpln://secret/{{APP_NAME}}-pg.password"
        - name: POSTGRES_USER #The name of the default user
          value: "cpln://secret/{{APP_NAME}}-pg.username"
      name: postgres
      image: postgres:15
      command: /bin/bash
      args:
        - "-c"
        - "cat /usr/local/bin/cpln-entrypoint.sh >> ./cpln-entrypoint.sh && chmod u+x ./cpln-entrypoint.sh && ./cpln-entrypoint.sh postgres"
      #command:  "cpln-entrypoint.sh"
      #args:
      #  - "postgres"
      ports:
        - number: 5432
          protocol: tcp
      volumes:
        - uri: "cpln://volumeset/{{APP_NAME}}-pg-vs"
          path: "/var/lib/postgresql/data"
        # Make the ENV value for the entry script a file
        - uri: "cpln://secret/{{APP_NAME}}-pg-script"
          path: "/usr/local/bin/cpln-entrypoint.sh"
      inheritEnv: false
      livenessProbe:
        tcpSocket:
          port: 5432
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        exec:
          command:
            - /bin/bash
            - -c
            - 'pg_isready -U "$POSTGRES_USER" -d "${POSTGRES_DB:-$POSTGRES_USER}" && test -f "$PGDATA/CPLN_READY"'
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
  identityLink: "//identity/{{APP_NAME}}-pg-identity"
  defaultOptions:
    capacityAI: false
    autoscaling:
      metric: cpu
      target: 95
      maxScale: 1
  firewallConfig:
    external:
      inboundAllowCIDR: []
      outboundAllowCIDR:
        - 0.0.0.0/0
    internal:
      inboundAllowType: same-gvc
