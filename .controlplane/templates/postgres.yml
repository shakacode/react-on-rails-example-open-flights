kind: volumeset
name: "{{APP_NAME}}-pg-vs"
description: "{{APP_NAME}}-pg-vs"
spec:
  autoscaling:
    maxCapacity: 1000
    minFreePercentage: 1
    scalingFactor: 1.1
  fileSystemType: ext4
  initialCapacity: 10
  performanceClass: general-purpose-ssd
  snapshots:
    createFinalSnapshot: true
    retentionDuration: 7d

---
kind: secret
name: "{{APP_NAME}}-pg"
description: ''
type: dictionary
data:
  password: the_password #Replace this with a real password
  username: the_user     #Replace this with a real username

