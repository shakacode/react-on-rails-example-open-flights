# Template setup of the GVC, roughly corresponding to a Heroku app
kind: gvc
name: "{{APP_NAME}}"
spec:
  env:
    - name: DATABASE_URL
      value: "cpln://secret/{{APP_SECRETS}}.DATABASE_URL"
    - name: RAILS_ENV
      value: production
    - name: RAILS_LOG_TO_STDOUT
      value: "true"
    - name: RAILS_SERVE_STATIC_FILES
      value: "true"
    - name: REDIS_URL
      value: "redis://redis.{{APP_NAME}}.cpln.local:6379"
    - name: ROOT_URL
      value: "cpln://secret/{{APP_SECRETS}}.ROOT_URL"
    - name: SENDGRID_USERNAME
      value: "cpln://secret/{{APP_SECRETS}}.SENDGRID_USERNAME"
    - name: SENDGRID_PASSWORD
      value: "cpln://secret/{{APP_SECRETS}}.SENDGRID_PASSWORD"
    - name: DEFAULT_FROM_EMAIL
      value: "cpln://secret/{{APP_SECRETS}}.DEFAULT_FROM_EMAIL"
    - name: SECRET_KEY_BASE
      value: "cpln://secret/{{APP_SECRETS}}.SECRET_KEY_BASE"
  staticPlacement:
    locationLinks:
      - "{{APP_LOCATION_LINK}}"
