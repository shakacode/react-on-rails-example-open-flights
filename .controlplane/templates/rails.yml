# Template setup of Rails server workload, roughly corresponding to Heroku dyno
# type within Procfile.
kind: workload
name: rails
spec:
  type: standard
  containers:
    - name: rails
      cpu: 300m
      inheritEnv: true
      image: "{{APP_IMAGE_LINK}}"
      memory: 512Mi
      ports:
        - number: 3000
          # Keep this as `http` even when fronting Rails with Thruster — the Control Plane
          # load balancer still serves HTTP/2 to end users. Setting `http2` here causes
          # `502 Bad Gateway` with "protocol error".
          # See https://www.shakacode.com/control-plane-flow/docs/thruster/ for details.
          protocol: http
      readinessProbe:
        exec:
          command:
            - ruby
            - -rnet/http
            - -e
            - >-
              request = Net::HTTP::Get.new('/hello_world');
              request['X-Forwarded-Proto'] = 'https';
              response = Net::HTTP.start('127.0.0.1', 3000, open_timeout: 1, read_timeout: 4) { |http| http.request(request) };
              exit(response.is_a?(Net::HTTPSuccess) ? 0 : 1)
        timeoutSeconds: 5
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 6
  defaultOptions:
    autoscaling:
      minScale: 1
      maxScale: 1
    capacityAI: true
    timeoutSeconds: 60
  firewallConfig:
    external:
      inboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowCIDR:
        - 0.0.0.0/0
  # cpflow apply-template replaces {{APP_IDENTITY_LINK}} with the app workload identity link.
  identityLink: "{{APP_IDENTITY_LINK}}"
