name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_flights_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DISABLE_SPRING: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_flights_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3.10'
          bundler: '2.4.19'
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: bundle exec rails db:prepare
      - run: .agents/bin/validate
      - name: Install deployment validators
        run: |
          gem install cpflow -v 5.3.0 --no-document
          GOBIN="${RUNNER_TEMP}/deployment-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${RUNNER_TEMP}/deployment-bin" >> "$GITHUB_PATH"
      - name: Validate deployment configuration
        run: bin/test-cpflow-github-flow
